name: Deploy web-karir to D PM2

# FULL OTOMATIS: push ke main -> server D:\itsp-karir langsung update (:3009).
# Butuh 1x pasang GitHub Self-Hosted Runner Windows di server (lihat PANDUAN_DEPLOY_D_PM2.md S8b).
# .env.production di D:\itsp-karir AMAN (di-ignore git, tidak tertimpa reset).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-itsp-karir
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull + build + pm2 restart :3009
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Update D:\itsp-karir dari GitHub
        run: |
          $ErrorActionPreference = "Stop"
          if (!(Test-Path D:\itsp-karir\.git)) { throw "D:\itsp-karir belum git clone web-karir. Clone dulu di Server: git clone https://github.com/idthaisummitplastech/web-karir.git D:\itsp-karir" }
          Set-Location D:\itsp-karir
          git config --global --add safe.directory D:/itsp-karir
          git fetch origin main
          git reset --hard origin/main
          npm ci --legacy-peer-deps
          npm run build
          try { pm2 restart itsp-karir }
          catch {
            Write-Host "pm2 restart gagal, coba pm2 start pertama kali..."
            pm2 start npm --name "itsp-karir" -- start
          }
          pm2 save
          pm2 list

      - name: Health check :3009
        run: |
          $ErrorActionPreference = "Stop"
          Start-Sleep -Seconds 10
          Invoke-WebRequest http://localhost:3009/ -UseBasicParsing | Select-Object StatusCode | Out-String | Write-Host
